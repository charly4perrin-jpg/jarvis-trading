[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-trading-agent"
version = "0.3.0"
license = "Apache-2.0"
description = "Public market data adapters and paper trading for crypto"
requires-python = ">=3.11"
dependencies = [
  "ccxt>=4.3.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.2",
  "fastapi>=0.110",
  "uvicorn>=0.29"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.5", "hypothesis==6.170.14"]

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_agent*"]

[tool.setuptools.package-data]
trading_agent = ["web/*", "web/vendor/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
